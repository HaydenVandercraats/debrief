<!doctype html>
<html>
<head>
  <title>Debrief — Setup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">
      <div class="auth-wordmark">Debrief</div>
      <div class="card">
        <p class="auth-subtitle">Set a password to protect your local Debrief instance. You'll use this password to log in every time you launch the app.</p>
        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        <form method="post">
          <div class="field">
            <label class="field-label" for="password">Choose a password</label>
            <input class="field-input" type="password" id="password" name="password" placeholder="Choose a password" required autofocus>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Set Password &amp; Continue</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
