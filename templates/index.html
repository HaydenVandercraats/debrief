<!doctype html>
<html>
<head><title>Debrief</title></head>
<body>
  <h1>Debrief</h1>
  <p>Tier: {{ tier }}</p>
  <a href="{{ url_for('logout') }}">Log out</a>
  <h2>New Call</h2>
  <form id="call-form" method="post" action="{{ url_for('upload_call') }}" enctype="multipart/form-data" onsubmit="return false;">
    <input type="text" name="company" placeholder="Company">
    <input type="text" name="contact_name" placeholder="Contact name">
    <label><input type="checkbox" name="keep_audio"> Keep audio recording</label>
    <br>
    <button type="button" id="start-btn">Start Recording</button>
    <button type="button" id="stop-btn" disabled>Stop &amp; Save</button>
    <p id="recorder-status"></p>
  </form>
  <script src="{{ url_for('static', filename='js/recorder.js') }}"></script>
  <h2>Past calls</h2>
  <ul>
    {% for call in calls %}
      <li><a href="{{ url_for('call_detail', call_id=call.id) }}">{{ call.created_at }} — {{ call.company or 'Unknown company' }} — {{ call.status }}</a></li>
    {% else %}
      <li>No calls yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
