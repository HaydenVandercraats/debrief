<!doctype html>
<html>
<head>
  <title>Debrief — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">
      <div class="auth-wordmark">Debrief</div>
      <div class="card">
        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        <form method="post">
          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" name="password" placeholder="Enter your password" required autofocus>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
